server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/safecore}
spring.datasource.username=${DB_USERNAME:safecore}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.scheduling.enabled=true

jwt.secret=${JWT_SECRET}
# Access token (curto). Flip para 900000 (15min) após clientes terem refresh em produção.
jwt.expiration=${JWT_EXPIRATION:900000}
# Refresh token: 1h — janela de inatividade. Cada uso renova por mais 1h (rotação);
# se o usuário ficar sem usar o sistema por esse tempo, expira e precisa logar de novo.
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:3600000}

# S3/MinIO Configuration
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket=${S3_BUCKET:engseg-evidencias}

# Claude AI (Anthropic)
claude.api.key=${CLAUDE_API_KEY}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email (Brevo HTTP API)
brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}

# Frontend URL (usado nos links dos emails)
app.frontend.url=${FRONTEND_URL}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
